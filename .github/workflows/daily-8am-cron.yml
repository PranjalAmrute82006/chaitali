name: Daily Cron Job - 8 AM

on:
  schedule:
    - cron: "0 8 * * *"

jobs:
  daily-job:
    runs-on: ubuntu-latest

    steps:
      - name: Job started
        run: echo "Daily 8 AM job has started!"

      - name: Display date and time
        run: date

      - name: Job completed
        run: echo "Daily 8 AM job completed successfully!"
